<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Hello Microservices - Updated by Ansible</title>
</head>
<body>
  <h1>Hello Microservices - Updated by Ansible</h1>

  <h2>Backend messages</h2>
  <button id="loadMessages">Load messages</button>
  <pre id="messages">No data loaded.</pre>

  <h2>WordPress posts</h2>
  <button id="loadPosts">Load posts</button>
  <pre id="posts">No data loaded.</pre>

  <script>
    async function loadJson(url, outputId) {
      const output = document.getElementById(outputId);
      output.textContent = "Loading...";

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: ${response.statusText}`
          );
        }

        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = `Request failed: ${error.message}`;
        console.error(error);
      }
    }

    document
      .getElementById("loadMessages")
      .addEventListener("click", () => {
        loadJson(
          "/api/messages",
          "messages"
        );
      });

    document
      .getElementById("loadPosts")
      .addEventListener("click", () => {
        loadJson(
          "/wp-json/posts",
          "posts"
        );
      });
  </script>
</body>
</html>
